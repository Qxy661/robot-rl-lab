# Go2 平地速度跟踪（四足，12 个受控关节，全关节受控）
#
# 只写与默认值不同的项。task、terrain.kind=flat、控制周期、回合长度与默认值
# 一致，不重复写。
#
# 三形态里 Go2 训练成本最低，是先把流程跑通的那一个。
# 奖励只写偏离项，其余沿用任务默认权重（robotrl/envs/tasks/velocity.py）。

env:
  robot: go2

obs:
  # 特权观测里的足端接触标志维度。默认 2 是给双足留的，四足不写就会少两维，
  # 观测维度与契约对不上。
  num_feet: 4

events:
  # 比默认的 200~400 步更频繁。四足在平地上被推倒的概率远低于人形，同样的
  # 鲁棒性收益可以用更少的总步数买到。
  push_interval_steps: [150, 300]
  # 默认的 -1.0~3.0 公斤是照人形的体重定的。Go2 自重只有十几公斤，同样 3 公斤
  # 的负载相当于五分之一的体重，那不是随机化，是换了个机器人。按体重比例收窄。
  base_mass_delta: [-0.5, 1.5]

reward:
  scales:
    # 任务默认是 -10.0。四足腿短、步态本身的躯干起伏比人形大，站高误差的平方
    # 天然就大，同样的权重会让这一项在总奖励里占比过高，把跟踪项的梯度稀释掉。
    base_height: -5.0
