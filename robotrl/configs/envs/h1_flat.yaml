# H1 平地速度跟踪（人形，11 个受控关节：腿 10 + 躯干 1）
#
# 只写与默认值不同的项。env.robot 必须写出来——默认是 g1，这份预设的全部意义
# 就在于换成 H1。task、terrain、控制周期、回合长度、双足足数都与默认值一致。
#
# 与 g1_flat.yaml 的差别来自形态本身，不是随手改的数：H1 的踝关节只有俯仰一个
# 自由度（G1 还有踝侧摆），机身往侧向歪的时候踝关节帮不上忙，只能靠髋部代偿。
#
# 奖励同样只写偏离项，其余沿用任务默认权重
# （robotrl/envs/tasks/velocity.py 的 _DEFAULT_REWARD_SCALES）。

env:
  robot: h1

events:
  push_interval_steps: [250, 500]

reward:
  scales:
    # 与 G1 同值：站高不足就"蹲着挪"这个退化解两个形态上都有，理由一样。
    base_height: -15.0
    # 比任务默认的 -1.0 重一倍。踝关节自由度少，姿态歪了几乎没有就地修正的
    # 手段，只能靠髋部代偿，所以宁可在小角度时就把梯度给足。
    orientation: -2.0
