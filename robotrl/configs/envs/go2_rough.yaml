# Go2 崎岖地形速度跟踪（四足，12 个受控关节）
#
# 在 go2_flat.yaml 的基础上换地形。地形一换，观测、域随机化、回合长度都要跟着
# 动——平地上够用的配置拿到起伏路上会立刻暴露两件事：策略看不见脚下，以及
# 回合不够长。
#
# 奖励只写偏离项，其余沿用任务默认权重（robotrl/envs/tasks/velocity.py）。

env:
  robot: go2
  # 平地的 20 秒在崎岖地形上常常走不完一段完整的越障过程，采到的多是"刚起步
  # 就结束"的片段。拉到 30 秒，每个回合才有足够多的成功与失败样本。
  max_episode_steps: 1500

terrain:
  kind: rough
  # 默认起伏 0.15 米对四足偏温和，策略靠腿部被动柔顺就能糊过去。抬到 0.2 米
  # 才逼得它主动抬腿、提前选落脚点。
  height_range: [0.0, 0.2]
  # 网格从默认的 0.1 米收到 0.08 米。网格太粗会把窄坎和坑洼直接抹平，
  # 策略在仿真里踩到的地形和观测里看到的高度场对不上。
  cell_size: 0.08

obs:
  num_feet: 4
  # 5x5 采样（默认 3x3）。平地只需要知道整体高度，崎岖地形还要知道脚下局部的
  # 坡向，否则策略只能靠试错去探。
  terrain_samples: 25
  # noise_scale 是整体替换而不是逐键合并，所以五项都得写全，哪怕只有两项变了。
  noise_scale:
    lin_vel: 0.2         # 起伏路面上机身速度估计本身就更不可信，噪声相应放大
    ang_vel: 0.2
    proj_gravity: 0.1    # 踩到凸起时姿态会突然抖一下，训练时得见过这种抖
    dof_pos: 0.01
    dof_vel: 0.5

events:
  # 崎岖地形上还会被地形本身绊到，外力冲击与地形扰动叠加，推力范围放宽一档，
  # 免得策略把"被推"和"踩空"当成两种完全不同的情况来处理。
  push_velocity_xy: [-0.8, 0.8]
  push_interval_steps: [150, 300]
  base_mass_delta: [-0.5, 1.5]

reward:
  scales:
    # 降到平地的三分之一。崎岖地形上机身高度目标本身就在变（脚下有起伏），
    # 死盯站高会把"为了踩稳而临时压低重心"也一起罚掉。
    base_height: -2.0
    # 打滑在起伏路面上更难恢复，罚得比平地的 -0.1 重。
    feet_slip: -0.2
